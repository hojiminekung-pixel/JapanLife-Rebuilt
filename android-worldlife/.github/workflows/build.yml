name: Build World Life Android
on:
  push:
    branches: [ worldlife-newgame ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android-worldlife
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1-Android
          path: android-worldlife/app/build/outputs/apk/release/app-release.apk