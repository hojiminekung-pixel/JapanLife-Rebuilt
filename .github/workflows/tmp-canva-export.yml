name: tmp-canva-export
on:
  push:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get Canva source previews
        run: |
          git fetch origin tmp/canva20-source:refs/remotes/origin/tmp/canva20-source
          git checkout origin/tmp/canva20-source -- tmp/canva20-512.webp
      - uses: actions/upload-artifact@v4
        with:
          name: canva20-512
          path: tmp/canva20-512.webp
