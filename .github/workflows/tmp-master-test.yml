name: tmp-master-test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/world%20life.zip" -o master-outer.zip
          mkdir outer inner
          unzip -q master-outer.zip -d outer
          inner_zip="$(find outer -type f -iname '*.zip' | head -n 1)"
          test -n "$inner_zip"
          unzip -q "$inner_zip" -d inner
          apk="$(find inner -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" master.apk
          ls -lh master.apk
          unzip -t master.apk >/dev/null
          unzip -p master.apk lib/armeabi/libKyotoLife.so >/tmp/lib.so
          test -s /tmp/lib.so
          echo MASTER_APK_OK
