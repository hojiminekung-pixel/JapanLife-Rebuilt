name: tmp-master-test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          : > result.txt
          for u in \
            "https://worldlife-gateway.bomsronthai.workers.dev/legacy/test" \
            "https://worldlife-gateway.bomsronthai.workers.dev/resource/data_building.smf" \
            "https://worldlife-gateway.bomsronthai.workers.dev/legacy-api-full/test" \
            "https://worldlife-gateway.bomsronthai.workers.dev/legacy-api-full/resource/data_building.smf" \
            "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/data_building.smf"; do
            echo "=== $u" >> result.txt
            curl -sS -D /tmp/h -o /tmp/b -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$u" >> result.txt 2>&1
            head -n 8 /tmp/h >> result.txt 2>&1
            head -c 160 /tmp/b >> result.txt 2>&1
            echo >> result.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-test
          path: result.txt
