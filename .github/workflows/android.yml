name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3
      GODOT_RELEASE: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Java required by Android tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Download pinned Noto Sans Thai font for offline packaging
        env:
          # Immutable Google Fonts commit; OFL 1.1 font source.
          NOTO_THAI_URL: https://raw.githubusercontent.com/google/fonts/23e54b51ddffbc7713c583748e3bd86f62b1fa4a/ofl/notosansthai/NotoSansThai%5Bwdth,wght%5D.ttf
        run: |
          mkdir -p assets/fonts
          rm -f assets/fonts/NotoSansThai-Regular.ttf assets/fonts/NotoSansThai-Regular.ttf.import
          curl --fail --location --retry 3 --retry-all-errors --output assets/fonts/NotoSansThai-Regular.ttf "$NOTO_THAI_URL"
          test -s assets/fonts/NotoSansThai-Regular.ttf
          # Reject an unexpectedly small HTTP error page or corrupt download.
          test "$(wc -c < assets/fonts/NotoSansThai-Regular.ttf)" -gt 100000

      - name: Create APK output directory
        run: mkdir -p build

      - name: Export Android debug APK with Godot 4 export templates
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: .
          use_preset_export_path: true
          export_debug: true
          presets_to_export: Android Debug
          verbose: true

      - name: Verify generated APK
        run: |
          test -s build/JapanLifeRebuilt-debug.apk
          unzip -t build/JapanLifeRebuilt-debug.apk
          # Godot regenerated the downloaded font import and packaged its font data.
          test -s assets/fonts/NotoSansThai-Regular.ttf.import
          unzip -l build/JapanLifeRebuilt-debug.apk | grep -q "NotoSansThai-Regular.ttf.*fontdata"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JapanLifeRebuilt-debug-apk
          path: build/JapanLifeRebuilt-debug.apk
          if-no-files-found: error
