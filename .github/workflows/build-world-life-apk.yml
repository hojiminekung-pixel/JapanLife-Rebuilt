          package com.nubee.japanlife;
          import java.io.*;
          import java.net.*;
          import java.util.*;
          public final class WorldLifeProxy {
              private static final int PORT=8765;
              private static final String UPSTREAM="https://worldlife-gateway.bomsronthai.workers.dev";
              private static volatile boolean started;
              public static synchronized void start(){
                  if(started)return; started=true;
                  Thread t=new Thread(new Runnable(){public void run(){serve();}},"WorldLifeProxy");
                  t.setDaemon(true); t.start();
              }
              private static void serve(){
                  try{
                      ServerSocket ss=new ServerSocket();
                      ss.setReuseAddress(true);
                      ss.bind(new InetSocketAddress(InetAddress.getByName("127.0.0.1"),PORT));
                      while(true){
                          final Socket client=ss.accept();
                          Thread w=new Thread(new Runnable(){public void run(){handle(client);}},"WorldLifeProxyClient");
                          w.setDaemon(true); w.start();
                      }
                  }catch(Throwable ignored){}
              }
              private static void handle(Socket s){
                  try{
                      s.setSoTimeout(30000);
                      BufferedInputStream in=new BufferedInputStream(s.getInputStream());
                      OutputStream out=s.getOutputStream();
                      String requestLine=readLine(in);
                      if(requestLine==null||requestLine.length()==0)return;
                      String[] rp=requestLine.split(" ");
                      if(rp.length<2)return;
                      String method=rp[0],path=rp[1];
                      Map<String,String> headers=new LinkedHashMap<String,String>();
                      String line;
                      while((line=readLine(in))!=null&&!line.isEmpty()){
                          int c=line.indexOf(':'); if(c>0)headers.put(line.substring(0,c).trim(),line.substring(c+1).trim());
                      }
                      int len=0; try{len=Integer.parseInt(headers.containsKey("Content-Length")?headers.get("Content-Length"):"0");}catch(Exception ignored){}
                      byte[] body=new byte[len]; int got=0;
                      while(got<len){int n=in.read(body,got,len-got);if(n<0)break;got+=n;}
                      String upstreamUrl;
                      if(path.startsWith("/resource/")){
                          upstreamUrl="https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-resources/"+path.substring(10);
                      }else{
                          String upstreamPath=path;
                          if(!(path.startsWith("/shop/")||path.startsWith("/legacy/")||path.startsWith("/legacy-api-full/")))upstreamPath="/legacy"+path;
                          upstreamUrl=UPSTREAM+upstreamPath;
                      }
                      HttpURLConnection c=(HttpURLConnection)new URL(upstreamUrl).openConnection();
                      c.setConnectTimeout(15000); c.setReadTimeout(30000); c.setRequestMethod(method); c.setInstanceFollowRedirects(true);
                      for(Map.Entry<String,String> e:headers.entrySet()){
                          String k=e.getKey();
                          if(k.equalsIgnoreCase("Host")||k.equalsIgnoreCase("Connection")||k.equalsIgnoreCase("Content-Length")||k.equalsIgnoreCase("Transfer-Encoding"))continue;
                          c.setRequestProperty(k,e.getValue());
                      }
                      if(len>0&&!method.equalsIgnoreCase("GET")&&!method.equalsIgnoreCase("HEAD")){
                          c.setDoOutput(true); c.setFixedLengthStreamingMode(len);
                          OutputStream co=c.getOutputStream(); try{co.write(body);}finally{co.close();}
                      }
                      int code=c.getResponseCode(); String msg=c.getResponseMessage();
                      out.write(("HTTP/1.1 "+code+" "+(msg==null?"OK":msg)+"\r\n").getBytes("ISO-8859-1"));
                      String ct=c.getHeaderField("Content-Type"); if(ct!=null)out.write(("Content-Type: "+ct+"\r\n").getBytes("ISO-8859-1"));
                      String ce=c.getHeaderField("Content-Encoding"); if(ce!=null)out.write(("Content-Encoding: "+ce+"\r\n").getBytes("ISO-8859-1"));
                      String cl=c.getHeaderField("Content-Length"); if(cl!=null)out.write(("Content-Length: "+cl+"\r\n").getBytes("ISO-8859-1"));
                      InputStream cin; try{cin=c.getInputStream();}catch(IOException ex){cin=c.getErrorStream();}
                      out.write("Connection: close\r\n\r\n".getBytes("ISO-8859-1"));
                      if(cin!=null){byte[] buf=new byte[8192];int n;while((n=cin.read(buf))!=-1)out.write(buf,0,n);cin.close();}
                      out.flush(); c.disconnect();
                  }catch(Throwable ignored){}finally{try{s.close();}catch(Throwable ignored){}}
              }
              private static String readLine(InputStream in)throws IOException{
                  ByteArrayOutputStream b=new ByteArrayOutputStream(); int cur;
                  while((cur=in.read())!=-1){
                      if(cur=='\r'){int next=in.read();if(next=='\n')break;if(next!=-1)b.write(next);break;}
                      if(cur=='\n')break;b.write(cur);
                  }
                  return b.size()==0&&cur==-1?null:new String(b.toByteArray(),"ISO-8859-1");
              }
          }
          JAVA
