          set -euo pipefail
          mkdir -p login-src login-classes login-dex /tmp/baksmali /tmp/login-smali
          cat > login-src/WorldLifeLoginActivity.java <<'JAVA'
package com.nubee.japanlife;
import android.app.Activity;
