    sign.setOnClickListener(v->auth(false)); reg.setOnClickListener(v->auth(true));
  }
  private void auth(boolean signup){ final String e=email.getText().toString().trim().toLowerCase(Locale.US), p=pass.getText().toString(); if(e.length()<3||p.length()<6){say("กรุณาตรวจสอบอีเมลและรหัสผ่าน");return;} say("กำลังเชื่อมต่อ World Life Server...");
    new Thread(()->{try{
      if(signup){ post(SUPA+"/auth/v1/signup","{\"email\":"+JSONObject.quote(e)+",\"password\":"+JSONObject.quote(p)+"}",null); runOnUiThread(()->say("สมัครแล้ว กรุณายืนยันอีเมล แล้วรอเจ้าของอนุมัติบัญชีก่อนเข้าเกม")); return; }
      JSONObject tok=post(SUPA+"/auth/v1/token?grant_type=password","{\"email\":"+JSONObject.quote(e)+",\"password\":"+JSONObject.quote(p)+"}",null);
      String access=tok.optString("access_token",""); String uid=tok.optJSONObject("user")!=null?tok.getJSONObject("user").optString("id",""):"";
      if(access.length()<10||uid.length()<10)throw new Exception(tok.optString("msg",tok.optString("error_description","login failed")));
      JSONObject prof=get(SUPA+"/rest/v1/profiles?id=eq."+URLEncoder.encode(uid,"UTF-8")+"&select=status,role,email",access);
      JSONArray a=prof.optJSONArray("array"); String status="pending",role="player"; if(a!=null&&a.length()>0){JSONObject z=a.getJSONObject(0);status=z.optString("status","pending");role=z.optString("role","player");}
      if(!"approved".equals(status)){final String s=status;runOnUiThread(()->say("บัญชีสถานะ: "+s+" — ยังไม่สามารถเข้าเกมได้"));return;}
      long gameId=stableId(uid); getSharedPreferences("worldlife_auth",0).edit().putBoolean("approved",true).putLong("uid",gameId).putString("email",e).putString("name",e.substring(0,e.indexOf('@'))).putString("role",role).apply();
      runOnUiThread(()->{say("เข้าสู่ระบบสำเร็จ กำลังเข้าเกม...");setResult(RESULT_OK);finish();});
    }catch(Exception ex){final String s=ex.getMessage()==null?"เชื่อมต่อไม่สำเร็จ":ex.getMessage();runOnUiThread(()->say(s));}}).start();
  }
  private void say(String s){msg.setText(s);}
  private static long stableId(String s){long h=1125899906842597L;for(int i=0;i<s.length();i++)h=31*h+s.charAt(i);h&=0x7fffffffffffffffL;return h==0?1:h;}
  private static JSONObject post(String u,String body,String bearer)throws Exception{return req(u,"POST",body,bearer);}
  private static JSONObject get(String u,String bearer)throws Exception{return req(u,"GET",null,bearer);}
  private static JSONObject req(String u,String method,String body,String bearer)throws Exception{HttpURLConnection c=(HttpURLConnection)new URL(u).openConnection();c.setConnectTimeout(15000);c.setReadTimeout(20000);c.setRequestMethod(method);c.setRequestProperty("apikey",KEY);c.setRequestProperty("Accept","application/json");if(bearer!=null)c.setRequestProperty("Authorization","Bearer "+bearer);if(body!=null){c.setDoOutput(true);c.setRequestProperty("Content-Type","application/json");byte[] b=body.getBytes(Charset.forName("UTF-8"));c.setFixedLengthStreamingMode(b.length);try(OutputStream o=c.getOutputStream()){o.write(b);}}int code=c.getResponseCode();InputStream in=code>=400?c.getErrorStream():c.getInputStream();StringBuilder s=new StringBuilder();if(in!=null){byte[] b=new byte[4096];int n;while((n=in.read(b))!=-1)s.append(new String(b,0,n,"UTF-8"));in.close();}if(code<200||code>=300)throw new IOException("Server "+code+": "+s.toString());String out=s.toString();if(out.startsWith("[")){JSONObject z=new JSONObject();z.put("array",new JSONArray(out));return z;}return new JSONObject(out);}
}
