name: World Life Native Avatar Analysis
on:
  push:
    paths:
      - '.github/workflows/worldlife-native-analysis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download Master
        run: |
          set -e
          curl -fL --retry 5 "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/world%20life.zip" -o master.zip
          unzip -q master.zip -d outer
          inner=$(find outer -type f -name '*.zip' | head -1)
          unzip -q "$inner" -d inner
          apk=$(find inner -type f -name '*.apk' | head -1)
          cp "$apk" master.apk
          unzip -q master.apk -d apk
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool binutils llvm
      - name: Native symbols and avatar analysis
        run: |
          set -e
          SO=apk/lib/armeabi/libKyotoLife.so
          echo '=== ELF ==='
          readelf -h "$SO"
          echo '=== AVATAR SYMBOLS ==='
          readelf -Ws "$SO" | grep -Ei 'CChooseAvatar|CMapTouchChooseAvatar|CUIAvatar|Avatar' | head -200 || true
          echo '=== NPC SYMBOLS ==='
          readelf -Ws "$SO" | grep -Ei 'Npc|NPC' | head -200 || true
          echo '=== RELEVANT STRINGS ==='
          strings -a "$SO" | grep -Ei 'avatar|npc|choose|character|select|japanlife|resource|patch|shop|save|device|login' | sort -u | head -500 || true
          echo '=== DATA FILES ==='
          find apk/res apk/assets -type f 2>/dev/null | grep -Ei 'npc|avatar|character|player|packed|font|data_.*\.smf$' | head -300 || true
          echo '=== MANIFEST ==='
          grep -o 'android:name="[^"]*"' apk/AndroidManifest.xml | head -50 || true
      - name: Decode SMF metadata
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,zlib,struct,re
          z=zipfile.ZipFile('master.apk')
          for name in z.namelist():
            if name.endswith('.smf') and ('npc' in name.lower() or 'avatar' in name.lower() or 'player' in name.lower()):
              b=z.read(name); pos=b.find(b'\x78')
              print('FILE',name,'bytes',len(b),'zlib',pos)
              if pos>=0:
                try:
                  d=zlib.decompress(b[pos:])
                  print('DEC',len(d),'head',d[:96].hex())
                  for m in re.finditer(rb'[A-Za-z][A-Za-z0-9_]{2,}',d):
                    if m.start()<5000: print(m.start(),m.group().decode(errors='ignore'))
                except Exception as e: print('ERR',e)
          PY
