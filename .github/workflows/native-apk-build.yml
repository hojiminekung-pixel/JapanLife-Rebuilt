name: Japan Life native APK build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the Japan Life v1.5.12 APK"
        required: true
        type: string
      mode:
        description: "Build mode"
        required: true
        default: "offline-fix"
        type: choice
        options:
          - offline-fix
          - thai-pack4-baseline
          - font-runtime-diagnostics
      server_url:
        description: "Optional replacement API base, e.g. http://10.0.2.2:8080/json"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original APK
        run: |
          mkdir -p input output
          curl -fL --retry 3 "${{ inputs.apk_url }}" -o input/Japan-Life-v1-5-12.apk
      - name: Verify baseline
        run: |
          python3 tools/inspect_japanlife.py input/Japan-Life-v1-5-12.apk > output/original-inspection.json
          python3 tools/verify_thai_font.py input/Japan-Life-v1-5-12.apk
          python3 tools/analyze_font_pack.py input/Japan-Life-v1-5-12.apk -o output/font-pack-diagnostics.json
      - name: Apply patch
        env:
          MODE: ${{ inputs.mode }}
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          if [ "$MODE" = "font-runtime-diagnostics" ]; then
            python3 tools/analyze_font_runtime.py input/Japan-Life-v1-5-12.apk -o output/font-runtime-diagnostics.json
            cp input/Japan-Life-v1-5-12.apk output/Japan-Life-1.5.12-font-runtime-baseline.apk
          elif [ "$MODE" = "offline-fix" ]; then
            python3 tools/patch_offline_fix.py input/Japan-Life-v1-5-12.apk -o output/Japan-Life-1.5.12-OFFLINE-FIX-unsigned.apk
          else
            python3 tools/patch_japanlife.py input/Japan-Life-v1-5-12.apk -o output/Japan-Life-1.5.12-thai-pack4-baseline-unsigned.apk
          fi
          if [ -n "$SERVER_URL" ]; then
            IN=$(ls output/*unsigned.apk | head -1)
            OUT=${IN%-unsigned.apk}-server-unsigned.apk
            python3 tools/patch_server_endpoint.py "$IN" "$OUT" --server "$SERVER_URL"
            rm "$IN"
          fi
      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0"
      - name: Align and sign APK
        run: |
          if [ "$MODE" = "font-runtime-diagnostics" ]; then exit 0; fi
          INPUT=$(ls output/*unsigned.apk | head -1)
          NAME=$(basename "$INPUT" .apk)
          zipalign -f -p 4 "$INPUT" "output/${NAME}-aligned.apk"
          keytool -genkeypair -v -keystore output/test.keystore -storepass android -keypass android -alias japanlife -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Japan Life Test"
          apksigner sign --ks output/test.keystore --ks-pass pass:android --key-pass pass:android --out "output/${NAME}-signed.apk" "output/${NAME}-aligned.apk"
          apksigner verify --verbose "output/${NAME}-signed.apk"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: japanlife-native-apk-${{ inputs.mode }}
          path: output/
