name: Japan Life native APK build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the Japan Life v1.5.12 APK that you are authorized to modify"
        required: true
        type: string
      experimental_fallback:
        description: "Reproduce the old one-byte Thai fallback experiment (not a production fix)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original APK
        run: |
          mkdir -p input output
          curl -fL --retry 3 "${{ inputs.apk_url }}" -o input/Japan-Life-v1-5-12.apk

      - name: Inspect original APK
        run: |
          python3 tools/inspect_japanlife.py input/Japan-Life-v1-5-12.apk > output/original-inspection.json
          cat output/original-inspection.json

      - name: Patch APK
        run: |
          if [ "${{ inputs.experimental_fallback }}" = "true" ]; then
            python3 tools/patch_japanlife.py input/Japan-Life-v1-5-12.apk               --experimental-fallback               -o output/Japan-Life-v1-5-12-experimental.apk
          else
            echo "Production patch not enabled yet; stopping intentionally." >&2
            exit 1
          fi

      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Align and sign APK
        run: |
          zipalign -f -p 4             output/Japan-Life-v1-5-12-experimental.apk             output/Japan-Life-v1-5-12-aligned.apk
          keytool -genkeypair -v             -keystore output/test.keystore             -storepass android             -keypass android             -alias japanlife             -keyalg RSA -keysize 2048             -validity 10000             -dname "CN=Japan Life Test"
          apksigner sign             --ks output/test.keystore             --ks-pass pass:android             --key-pass pass:android             --out output/Japan-Life-v1-5-12-test.apk             output/Japan-Life-v1-5-12-aligned.apk

      - name: Verify signature
        run: apksigner verify --verbose output/Japan-Life-v1-5-12-test.apk

      - name: Upload APK and analysis
        uses: actions/upload-artifact@v4
        with:
          name: japanlife-native-apk
          path: output/
