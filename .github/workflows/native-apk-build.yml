name: Japan Life native APK build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL to the Japan Life v1.5.12 APK that you are authorized to modify"
        required: true
        type: string
      patch_mode:
        description: "Patch mode"
        required: true
        default: "thai-pack4-test"
        type: choice
        options:
          - thai-pack4-test
          - historical-fallback-0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original APK
        run: |
          mkdir -p input output
          curl -fL --retry 3 "${{ inputs.apk_url }}" -o input/Japan-Life-v1-5-12.apk

      - name: Inspect original APK
        run: |
          python3 tools/inspect_japanlife.py input/Japan-Life-v1-5-12.apk > output/original-inspection.json
          cat output/original-inspection.json

      - name: Patch APK
        run: |
          if [ "${{ inputs.patch_mode }}" = "thai-pack4-test" ]; then
            python3 tools/patch_japanlife.py input/Japan-Life-v1-5-12.apk               --thai-pack4-test               -o output/Japan-Life-v1-5-12-thai-pack4-test.apk
          else
            python3 tools/patch_japanlife.py input/Japan-Life-v1-5-12.apk               --experimental-fallback               -o output/Japan-Life-v1-5-12-fallback0-test.apk
          fi

      - name: Install Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Align and sign APK
        run: |
          if [ "${{ inputs.patch_mode }}" = "thai-pack4-test" ]; then
            INPUT=output/Japan-Life-v1-5-12-thai-pack4-test.apk
            NAME=Japan-Life-v1-5-12-thai-pack4-test
          else
            INPUT=output/Japan-Life-v1-5-12-fallback0-test.apk
            NAME=Japan-Life-v1-5-12-fallback0-test
          fi
          zipalign -f -p 4 "$INPUT" "output/${NAME}-aligned.apk"
          keytool -genkeypair -v             -keystore output/test.keystore             -storepass android             -keypass android             -alias japanlife             -keyalg RSA -keysize 2048             -validity 10000             -dname "CN=Japan Life Test"
          apksigner sign             --ks output/test.keystore             --ks-pass pass:android             --key-pass pass:android             --out "output/${NAME}-signed.apk"             "output/${NAME}-aligned.apk"

      - name: Verify signature
        run: |
          if [ "${{ inputs.patch_mode }}" = "thai-pack4-test" ]; then
            apksigner verify --verbose output/Japan-Life-v1-5-12-thai-pack4-test-signed.apk
          else
            apksigner verify --verbose output/Japan-Life-v1-5-12-fallback0-test-signed.apk
          fi

      - name: Upload APK and analysis
        uses: actions/upload-artifact@v4
        with:
          name: japanlife-native-apk-${{ inputs.patch_mode }}
          path: output/
