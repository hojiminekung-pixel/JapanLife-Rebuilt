name: World Life Master Targeted Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/worldlife-master-targeted-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip binutils
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Download exact Master
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 2 "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/world%20life.zip" -o /tmp/outer.zip
          mkdir -p /tmp/outer /tmp/inner
          unzip -q /tmp/outer.zip -d /tmp/outer
          z=$(find /tmp/outer -type f -iname '*.zip' | head -1)
          unzip -q "$z" -d /tmp/inner
          apk=$(find /tmp/inner -type f -name '*.apk' | head -1)
          cp "$apk" /tmp/master.apk
      - name: Targeted analysis
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/decoded /tmp/jadx-out report
          apktool d -f --no-assets --no-res -o /tmp/decoded /tmp/master.apk >/tmp/apktool.log 2>&1
          /tmp/jadx/bin/jadx --no-res --threads-count 2 -d /tmp/jadx-out /tmp/master.apk >/tmp/jadx.log 2>&1 || true
          mkdir report
          {
            echo "SHA256"; sha256sum /tmp/master.apk
            echo
            echo "MANIFEST PACKAGE/ACTIVITIES"
            grep -E 'package=|activity|service|receiver|provider' /tmp/decoded/AndroidManifest.xml | head -200 || true
            echo
            echo "EXACT LEGACY HOST REFERENCES IN SMALI"
            grep -RniE 'jplife\\.nubee\\.com|st-jplife\\.nubee\\.com|japanlife\\.nubee\\.com' /tmp/decoded/smali* 2>/dev/null | head -300 || true
            echo
            echo "EXACT LEGACY HOST REFERENCES IN DECOMPILED JAVA"
            grep -RniE 'jplife\\.nubee\\.com|st-jplife\\.nubee\\.com|japanlife\\.nubee\\.com' /tmp/jadx-out 2>/dev/null | head -200 || true
            echo
            echo "GAME ACTIVITY AND SOCIAL CALL SITES"
            for f in \
              /tmp/jadx-out/sources/com/nubee/japanlife/GameActivity.java \
              /tmp/jadx-out/sources/com/nubee/FBConnect/FacebookMgr.java \
              /tmp/jadx-out/sources/com/nubee/RenrenConnect/RenrenMgr.java \
              /tmp/jadx-out/sources/com/nubee/WeiboConnect/WeiboMgr.java \
              /tmp/jadx-out/sources/com/nubee/TencentConnect/TencentMgr.java; do
              if [ -f "$f" ]; then echo "### $f"; grep -n -E 'login|Login|Facebook|Renren|Weibo|Tencent|native|JNI|onActivityResult|startActivity|userId|user_id' "$f" | head -250 || true; fi
            done
            echo
            echo "SOCIAL/JAVA LOGIN CLASS LIST"
            grep -RilE 'facebook|renren|weibo|tencent|twitter|login|oauth|get_user_id|CGameServer|FacebookID' /tmp/jadx-out/sources 2>/dev/null | grep -Ev '/(org/apache|org/scribe|com/sun/mail|com/inmobi|com/facebook|com/twitter|com/renren|com/weibo|com/tencent)/' | head -300 || true
            echo
            echo "NETWORK/LOGIN CLASSES OUTSIDE THIRD-PARTY LIBRARIES"
            grep -RilE 'jplife\\.nubee\\.com|st-jplife\\.nubee\\.com|japanlife\\.nubee\\.com' /tmp/jadx-out 2>/dev/null | grep -Ev '/(org/apache|org/scribe|com/sun/mail|com/inmobi|com/facebook|com/twitter|com/renren|com/weibo)/' | head -200 || true
            echo
            echo "ALL APP-SPECIFIC SOURCE ROOTS"
            find /tmp/jadx-out/sources -mindepth 1 -maxdepth 3 -type d 2>/dev/null | sed 's#^/tmp/jadx-out/sources/##' | sort | head -300 || true
            echo
            echo "NATIVE HOST CONTEXT"
            for so in /tmp/decoded/lib/*/*.so; do
              echo "### $so"
              strings -a -t x "$so" | grep -Ei -C 3 'jplife|st-jplife|japanlife|nubee|login|oauth|account|resource|shop|save|patch|http' | head -500 || true
            done
            echo
            echo "DEX STRING CONTEXT"
            strings -a -t x /tmp/decoded/classes.dex | grep -Ei -C 3 'jplife|st-jplife|japanlife|nubee|login|oauth|account|resource|shop|save|patch' | head -500 || true
          } > report/targeted-audit.txt
          cat report/targeted-audit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: World-Life-Master-Targeted-Audit
          path: report/targeted-audit.txt
          retention-days: 14
