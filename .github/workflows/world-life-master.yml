name: World Life Master APK 0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-master:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout World Life build branch
        uses: actions/checkout@v4

      - name: Validate exact original v1.5.12 APK
        run: |
          test -f master-input/Japan-Life-v1-5-12.apk
          sha256sum master-input/Japan-Life-v1-5-12.apk
          echo "710fe5887768ddb6f68c5bb192dd48335afe141491c13d16dce19d74fd2b2d71  master-input/Japan-Life-v1-5-12.apk" | sha256sum -c -

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apktool
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Decode the original APK
        run: |
          rm -rf work
          mkdir -p work
          apktool d -f master-input/Japan-Life-v1-5-12.apk -o work/decoded
          test -f work/decoded/AndroidManifest.xml
          test -f work/decoded/lib/armeabi/libKyotoLife.so

      - name: Apply the verified 4-byte internal-storage patch
        run: |
          python3 tools/apply_verified_native_patch.py work/decoded/lib/armeabi/libKyotoLife.so

      - name: Apply World Life identity
        run: |
          python3 tools/world_life_manifest.py work/decoded/AndroidManifest.xml "World Life" "0.1"

      - name: Rebuild APK
        run: |
          apktool b work/decoded -o work/world-life-0.1-unsigned.apk
          test -s work/world-life-0.1-unsigned.apk

      - name: Align and sign APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -1)
          AS=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          test -x "$BT"
          test -x "$AS"
          keytool -genkeypair -v -keystore work/worldlife.keystore \
            -alias worldlife -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=World Life, O=World Life" >/dev/null 2>&1 || true
          "$BT" -f -p 4 work/world-life-0.1-unsigned.apk work/world-life-0.1-aligned.apk
          "$AS" sign --ks work/worldlife.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out work/World-Life-0.1.apk work/world-life-0.1-aligned.apk
          "$AS" verify --verbose work/World-Life-0.1.apk

      - name: Verify final APK identity
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)
          "$AAPT" dump badging work/World-Life-0.1.apk | tee work/badging.txt
          grep -F "versionName='0.1'" work/badging.txt
          grep -F "application-label:'World Life'" work/badging.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1
          path: work/World-Life-0.1.apk
          if-no-files-found: error
