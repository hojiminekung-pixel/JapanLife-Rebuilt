name: World Life Android APK
on:
  push:
    paths:
      - 'android-worldlife/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: 'worldlife-newgame'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: android-worldlife
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1-APK
          path: android-worldlife/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error