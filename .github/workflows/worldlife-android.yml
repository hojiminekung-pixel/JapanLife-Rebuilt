name: World Life Android APK
on:
  push:
    paths:
      - 'android-worldlife/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldlife-newgame
          fetch-depth: 0
      - name: Verify project files
        run: |
          echo "BUILD_REF=$(git rev-parse HEAD)"
          test -f android-worldlife/settings.gradle
          test -f android-worldlife/build.gradle
          test -f android-worldlife/app/build.gradle
          find android-worldlife -maxdepth 3 -type f | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: android-worldlife
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1-APK
          path: android-worldlife/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error