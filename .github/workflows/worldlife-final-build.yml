name: World Life Final Build

on:
  push:
    paths:
      - .github/workflows/worldlife-final-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download stored Master
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 2 \
            "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/world%20life.zip" \
            -o master-outer.zip
          mkdir outer inner
          unzip -q master-outer.zip -d outer
          inner_zip="$(find outer -type f -iname '*.zip' | head -n 1)"
          test -n "$inner_zip"
          unzip -q "$inner_zip" -d inner
          apk="$(find inner -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" master.apk
          ls -lh master.apk

      - name: Save unmodified Master APK
        run: |
          set -e
          cp master.apk World-Life-Master-Original.apk
          sha256sum World-Life-Master-Original.apk
          unzip -t World-Life-Master-Original.apk >/dev/null

      - name: Upload unmodified Master APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-Master-Original
          path: World-Life-Master-Original.apk
          retention-days: 14

      - name: Verify World-Life-Gateway
        run: |
          set -e
          GATEWAY="https://worldlife-gateway.bomsronthai.workers.dev"
          for route in "/health" "/legacy/test" "/legacy/json/util/version_check?game_version=0.1" "/legacy/json/get/get_game_data_url?game_version=0.1" "/resource/data_building.smf" "/japanlife/v1_5_7/data_building.smf" "/devices?udid=build-test"; do
            code="$(curl -sS -o /tmp/gateway-body -w '%{http_code}' "$GATEWAY$route" || true)"
            size="$(wc -c < /tmp/gateway-body 2>/dev/null || echo 0)"
            echo "Gateway $route -> HTTP $code, $size bytes"
            head -c 200 /tmp/gateway-body || true
            echo
          done
          curl -fsS "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-resources/data_building.smf" -o storage-resource.smf
          test -s storage-resource.smf
          echo "World-Life resource storage fetch passed: $(wc -c < storage-resource.smf) bytes"

      - name: Install APK build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y apktool
          echo "ANDROID_HOME=$ANDROID_HOME"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          D8="$BUILD_TOOLS/d8"
          test -x "$D8"
          echo "D8=$D8" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)" >> "$GITHUB_ENV"

      - name: Audit Master launcher and social components
        run: |
          set -e
          mkdir -p preaudit
          apktool d -f --no-src -o preaudit/decoded master.apk >/dev/null
          grep -E '<activity|<service|<receiver|<provider' preaudit/decoded/AndroidManifest.xml | head -300 > preaudit/manifest-components.txt || true
          strings -a master.apk | grep -Ei 'facebook|renren|weibo|tencent|twitter|login|oauth|jplife|japanlife|nubee' | sort -u | head -500 > preaudit/social-strings.txt || true
          cat preaudit/manifest-components.txt
          echo '--- social strings ---'
          cat preaudit/social-strings.txt
      - name: Upload Master pre-audit
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-Master-PreAudit
          path: preaudit
          retention-days: 14

      - name: Decode original Master
        run: |
          set -e
          apktool d -f --no-src -o decoded master.apk
          test -f decoded/AndroidManifest.xml
          test -f decoded/lib/armeabi/libKyotoLife.so

      - name: Verify Master remains unmodified
        run: |
          set -euo pipefail
          cp master.apk World-Life-0.1-Master-Baseline.apk
          unzip -t World-Life-0.1-Master-Baseline.apk >/dev/null
          sha256sum World-Life-0.1-Master-Baseline.apk
          echo "No native, manifest, resource, startup, or signing modifications."

      - name: Upload Master baseline
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1-Master-Baseline
          path: World-Life-0.1-Master-Baseline.apk
          retention-days: 14

      - name: Patch only fixed-length World Life endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              b"japanlife.nubee.com": b"wl-server.pages.dev",
              b"d3p9l6k6r2a1z7.cloudfront.net": b"worldlife-resources.pages.dev",
          }

          root = Path("decoded")
          totals = {k: 0 for k in replacements}

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              original = data
              for old, new in replacements.items():
                  if len(old) != len(new):
                      raise SystemExit(f"length mismatch: {old!r} -> {new!r}")
                  count = data.count(old)
                  if count:
                      data = data.replace(old, new)
                      totals[old] += count
              if data != original:
                  path.write_bytes(data)

          print("Endpoint replacement counts:", totals)
          if totals[b"japanlife.nubee.com"] == 0:
              raise SystemExit("ERROR: original API hostname was not found")
          if totals[b"d3p9l6k6r2a1z7.cloudfront.net"] == 0:
              raise SystemExit("ERROR: original patch CDN hostname was not found")

          for old in replacements:
              for path in root.rglob("*"):
                  if path.is_file() and old in path.read_bytes():
                      raise SystemExit(f"ERROR: old hostname remains in {path}")
          print("Fixed-length endpoint patch passed.")
          PY

      - name: Verify patched native library and manifest
        run: |
          set -euo pipefail
          test -f decoded/lib/armeabi/libKyotoLife.so
          strings -a decoded/lib/armeabi/libKyotoLife.so | grep -F "wl-server.pages.dev"
          strings -a decoded/lib/armeabi/libKyotoLife.so | grep -F "worldlife-resources.pages.dev"
          if strings -a decoded/lib/armeabi/libKyotoLife.so | grep -E "japanlife\.nubee\.com|d3p9l6k6r2a1z7\.cloudfront\.net"; then
            echo "ERROR: old native endpoint remains"
            exit 1
          fi
          echo "Native endpoint verification passed."

      - name: Rebuild, align and sign World Life Online-Compatible APK
        run: |
          set -e
          apktool b decoded -o world-life-online-unsigned.apk
          "$BUILD_TOOLS/zipalign" -f -p 4 world-life-online-unsigned.apk world-life-online-aligned.apk
          keytool -genkeypair -v -keystore world-life-debug.keystore             -storepass android -keypass android -alias androiddebugkey             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=World Life, O=World-Life-Server, C=TH"
          "$BUILD_TOOLS/apksigner" sign --ks world-life-debug.keystore             --ks-pass pass:android --key-pass pass:android             --out World-Life-0.1-Online-Compatible.apk world-life-online-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose World-Life-0.1-Online-Compatible.apk
          sha256sum World-Life-0.1-Online-Compatible.apk
          ls -lh World-Life-0.1-Online-Compatible.apk

      - name: Upload online-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: World-Life-0.1-Online-Compatible
          path: World-Life-0.1-Online-Compatible.apk
          retention-days: 14

# resource bucket corrected: world-life-resources
