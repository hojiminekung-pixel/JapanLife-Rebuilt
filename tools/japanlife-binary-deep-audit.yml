name: Japan Life Binary Deep Audit

on:
  push:
    paths:
      - tools/japanlife-binary-deep-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils unzip apktool

      - name: Audit Japan Life RAR
        shell: bash
        run: |
          set +e
          mkdir -p audit
          RAR="com.nubee.japanlife.part1.rar"
          {
            echo "# Japan Life binary deep audit"
            echo
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "## RAR file"
            stat "$RAR"
            sha256sum "$RAR"
            echo
            echo "### 7z list"
            7z l "$RAR"
            echo
            echo "### 7z test"
            7z t "$RAR"
          } > audit/japanlife-rar.txt 2>&1
          mkdir -p audit/rar_extract
          7z x -y "$RAR" -oaudit/rar_extract >> audit/japanlife-rar.txt 2>&1 || true
          find audit/rar_extract -type f -printf '%p %s bytes\n' | sort >> audit/japanlife-rar.txt

      - name: Audit World Life Master native baseline
        shell: bash
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 2 \
            "https://hgsugqaswxxkrsalvkci.supabase.co/storage/v1/object/public/world-life-master/world%20life.zip" \
            -o audit/master-outer.zip
          mkdir -p audit/master_outer audit/master_inner
          unzip -q audit/master-outer.zip -d audit/master_outer
          inner_zip="$(find audit/master_outer -type f -iname '*.zip' | head -n 1)"
          test -n "$inner_zip"
          unzip -q "$inner_zip" -d audit/master_inner
          apk="$(find audit/master_inner -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" audit/master.apk
          mkdir -p audit/master_decoded audit/master_native
          apktool d -f --no-src -o audit/master_decoded audit/master.apk >/dev/null
          cp audit/master_decoded/lib/armeabi/libKyotoLife.so audit/master_native/libKyotoLife.so
          sha256sum audit/master.apk audit/master_native/libKyotoLife.so > audit/master-hashes.txt
          unzip -l audit/master.apk | grep -E 'libKyotoLife\.so|res/raw/.*\.smf$|AndroidManifest.xml' > audit/master-layout.txt || true
          strings -a audit/master_native/libKyotoLife.so | grep -Ei 'https?://|japanlife|nubee|patch|resource|server|shop|save|login|device|version|json|/v[0-9]' | sort -u > audit/master-native-strings.txt || true
          strings -a audit/master.apk | grep -Ei 'https?://|japanlife|nubee|patch|resource|server|shop|save|login|device|version|json' | sort -u > audit/master-apk-strings.txt || true
          find audit/master_decoded -type f -name '*.smf' -printf '%f %s bytes\n' | sort > audit/master-smf-files.txt || true

      - name: Build compact report
        shell: bash
        run: |
          {
            echo "# Japan Life / World Life Deep Audit"
            echo
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            echo "## Branch binary"
            cat audit/japanlife-rar.txt
            echo
            echo "## Master hashes"
            cat audit/master-hashes.txt
            echo
            echo "## Master native server strings"
            cat audit/master-native-strings.txt
            echo
            echo "## Master APK strings"
            cat audit/master-apk-strings.txt
            echo
            echo "## Master layout"
            head -n 250 audit/master-layout.txt
            echo
            echo "## Master SMF inventory"
            cat audit/master-smf-files.txt
          } > audit/japanlife-branch-audit.md

      - name: Commit audit report
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp audit/japanlife-branch-audit.md reports/japanlife-branch-audit.md
          cp audit/japanlife-rar.txt reports/japanlife-rar.txt
          cp audit/master-native-strings.txt reports/master-native-strings.txt
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "Add Japan Life binary deep audit [skip ci]"
          git push
